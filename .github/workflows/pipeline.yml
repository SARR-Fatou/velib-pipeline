name: Pipeline Vélib'

on:
  schedule:
    - cron: "7 * * * *"   # toutes les heures, à la 7e minute
  workflow_dispatch:       # lancement manuel possible depuis l'onglet Actions

permissions:
  contents: write

concurrency:
  group: velib-pipeline
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests unitaires
        run: python -m unittest -v

      - name: Exécution du pipeline (extract, transform, load)
        run: python -m src.run_pipeline

      - name: Enregistrement des nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.csv docs/data
          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée."
          else
            git commit -m "data: collecte $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
